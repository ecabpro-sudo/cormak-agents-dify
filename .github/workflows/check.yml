name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Load plugin manifest, OAuth schema and all ten tools
        run: python -c 'from main import plugin; assert len(plugin.registration.tools_configuration[0].tools) == 10'
